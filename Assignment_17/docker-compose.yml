version: '3.8'

services:
  fruitclassifier:
    build: .
    container_name: fruitclassifier-edge
    ports:
      - "8000:8000"
    volumes:
      - ./edge_storage:/app/edge_storage
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE_ID=local-test-device
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - iot-edge
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  iot-edge:
    driver: bridge
